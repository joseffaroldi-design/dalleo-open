name: Temporary PR11 QA
on:
  push:
    branches:
      - yearly-archive-rollover-v2

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend QA dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.110.1 pydantic==2.11.7 motor==3.3.1 pymongo==4.6.3 python-dotenv requests bcrypt==4.1.3 pyjwt python-multipart pytest pytest-xdist

      - name: Run Tournament Years tests
        run: |
          cd backend
          PYTHONPATH=. pytest -q tests/test_tournament_years.py -n 0

      - name: Verify backend entrypoint and Tournament Years routes
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: dalleo_qa
          JWT_SECRET: qa-only
          ADMIN_EMAIL: qa@example.com
          ADMIN_PASSWORD: qa-password
          EMERGENT_LLM_KEY: qa-only
        run: |
          cd backend
          python - <<'PY'
          import server
          paths = {r.path for r in server.app.routes}
          expected = {
              "/api/admin/tournaments/years",
              "/api/admin/tournaments/year/{year}",
              "/api/admin/tournaments/archive",
              "/api/admin/tournaments/rollover",
              "/api/admin/tournaments/players",
          }
          missing = expected - paths
          assert not missing, f"missing routes: {sorted(missing)}"
          assert "/api/admin/{domain}" in paths
          print("route registration PASS")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Production frontend build
        working-directory: frontend
        env:
          CI: "true"
        run: yarn build
